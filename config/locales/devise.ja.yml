# config/locales/devise.ja.yml
# Devise の日本語訳ファイル 標準の翻訳（ログイン、登録、パスワードリセットなど）

ja: # 日本語設定の開始
  devise: # Devise の設定
    sessions: # セッション（ログイン・ログアウト）関連の設定
      new: # ログイン画面の設定
        title: "ログイン" # ログイン画面のタイトル
        sign_in: ログイン # ログインボタンのラベル
      signed_in: ログインしました # ログイン成功時のメッセージ
      signed_out: ログアウトしました # ログアウト成功時のメッセージ
      already_signed_out: "すでにログアウト済みです" # すでにログアウトしている場合のメッセージ
    registrations: # ユーザー登録関連の設定
      new: # 新規登録画面の設定
        title: "新規登録" # 新規登録画面のタイトル
        sign_up: 登録 # 登録ボタンのラベル
      signed_up: 新規登録が完了しました # 登録成功時のメッセージ
      signed_up_but_unconfirmed: 確認メールを送信しました。メールが届いていない場合は迷惑フォルダを確認してください。 # 登録成功したがメールアドレスが未確認の場合のメッセージ
      updated: "アカウント情報を変更しました" # ユーザー情報更新成功時のメッセージ
      destroyed: アカウントを削除しました # アカウント削除成功時のメッセージ
    passwords: # パスワードリセット関連の設定
      new: # パスワードリセット画面の設定
        title: "パスワードをお忘れですか?" # パスワードリセット画面のタイトル
        forgot_your_password: パスワードをお忘れですか? # パスワードリセット画面のタイトル
        send_me_reset_password_instructions: "パスワードの再設定方法を送信する" # パスワードリセットボタンのラベル
      edit: # パスワード変更画面の設定
        title: "パスワードの変更" # パスワード変更画面のタイトル
        change_my_password: "パスワードを変更する" # パスワード変更ボタンのラベル
      send_instructions: パスワードのリセット方法を数分以内にメールでご連絡します # パスワードリセットメール送信後のメッセージ
      updated: "パスワードが正常に変更されました" # パスワードリセット成功時のメッセージ
      updated_not_active: "パスワードが正常に変更されました" # パスワードリセット成功後のメッセージ
      send_paranoid_instructions: "メールアドレスが登録済みの場合、パスワード再設定用のメールが数分以内に送信されます" # パスワードリセットメールが見つからない場合のメッセージ
    confirmations: # メールアドレス確認関連の設定
      new: # メールアドレス確認画面の設定
        title: "確認メールの再送" # メールアドレス確認画面のタイトル
        resend_confirmation_instructions: "確認メールを再送する" # 確認メール再送ボタンのラベル
      send_instructions: アカウントの有効化について数分以内にメールでご連絡します # メールアドレス確認メール送信後のメッセージ
      confirmed: "メールアドレスが確認できました" # メールアドレス確認成功時のメッセージ
      send_paranoid_instructions: "メールアドレスが登録済みの場合、確認用のメールが数分以内に送信されます" # 確認メールが見つからない場合のメッセージ 
    unlocks: # アカウントロック関連の設定
      new:
        title: "アカウントのロック解除" # 【追加】アカウントロック解除画面のタイトル
        resend_unlock_instructions: "アカウントのロック解除方法を再送する" # 【追加】ロック解除メール再送ボタンのラベル
      unlocked: "アカウントをロック解除しました" # 【追加】ロック解除成功時のメッセージ
      send_instructions: "アカウントのロック解除方法を数分以内にメールでご連絡します" # 【追加】ロック解除メール送信後のメッセージ
      send_paranoid_instructions: "アカウントが見つかった場合、アカウントのロック解除方法を数分以内にメールでご連絡します" # 【追加】ロック解除メールが見つからない場合のメッセージ
    failure: # ログイン失敗時のメッセージ設定
      invalid: メールアドレスまたはパスワードが違います。 # 認証情報が間違っている場合のメッセージ
      timeout: 通信に失敗しました。インターネット接続を確認してください。 # 通信エラーが発生した場合のメッセージ
      unauthenticated: ログインしてください。 # 未ログイン状態でアクセスした場合のメッセージ
      already_authenticated: すでにログインしています。 # すでにログイン済みの場合のメッセージ
    shared: # 共通で使用する設定
      minimum_password_length: "（%{count}文字以上）" # パスワードの最小文字数を表示するテキスト
      links: # リンクのテキスト設定
        sign_in: ログイン # ログインページへのリンクテキスト
        sign_up: 登録 # 登録ページへのリンクテキスト
        forgot_password: パスワードをお忘れですか？ # パスワードリセットページへのリンクテキスト