#docker-compose.yml 
# Docker Compose のバージョンを指定
# version: '3.8' 

# 複数のサービス（コンテナ）を定義
services:
  # Rails アプリケーション用のサービス
  web:
    # Dockerfile からイメージをビルド（カレントディレクトリの Dockerfile を使用）
    build: .
    
    # コンテナ起動時に実行するコマンド
    # rm -f tmp/pids/server.pid : 前回起動時のプロセスIDファイルを削除（エラー防止）
    # -p 3000 : ポート番号を明示的に指定
    # -b '0.0.0.0' : 外部からのアクセスを許可
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    
    # ホストとコンテナ間でファイルを共有（マウント）
    volumes:
      # カレントディレクトリ(.)をコンテナ内の /app にマウント
      - .:/app
      #gem を永続化するためのボリュームをマウント
      - bundle:/usr/local/bundle 
    
    # ポートのマッピング（ホスト:コンテナ）
    # ホストの 3000 番ポートをコンテナの 3000 番ポートに接続
    ports:
      - "3000:3000"
    
    # 依存関係の設定（db と redis サービスが起動してから web を起動）
    depends_on:
      - db
      - redis # redis サービスへの依存を追加
  
    # .envファイルから環境変数を読み込む設定
    env_file:
      - .env
    
    # ターミナルを有効化（pry や byebug などのデバッグツールを使えるようにする）
    tty: true
    # 標準入力を有効化（対話的な操作を可能にする）
    stdin_open: true

  # PostgreSQL データベース用のサービス
  db:
    # Docker Hub から PostgreSQL 14 の公式イメージを取得
    image: postgres:14
    
    # PostgreSQL の環境変数を設定
    environment:
      # データベースのユーザー名
      POSTGRES_USER: postgres
      # データベースのパスワード
      POSTGRES_PASSWORD: password
    
    # データベースのデータを永続化（コンテナを削除してもデータが残る）
    # 名前付きボリューム postgres_data をコンテナ内の /var/lib/postgresql/data にマウント
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    # ポートのマッピング（ホスト:コンテナ）
    # ホストの 5432 番ポートをコンテナの 5432 番ポートに接続
    # これにより、ホストから直接 PostgreSQL に接続できる
    ports:
      - "5432:5432"

  # Redis サーバー用のサービス（Sidekiq のジョブキューとして使用）
  redis:
    # Docker Hub から Redis 7 の Alpine Linux 版イメージを取得（軽量版）
    image: redis:7-alpine
    # ポートのマッピング（ホスト:コンテナ）
    # ホストの 6379 番ポートをコンテナの 6379 番ポートに接続
    ports:
      - "6379:6379"
    # Redis のデータを永続化（コンテナを削除してもデータが残る）
    volumes:
      # 名前付きボリューム redis_data をコンテナ内の /data にマウント
      - redis_data:/data
    # Redis サーバーを AOF（Append Only File）モードで起動（データの永続化を有効化）
    command: redis-server --appendonly yes

  # Sidekiq サービス（バックグラウンドでジョブを処理するワーカー）
  sidekiq:
    # Dockerfile からイメージをビルド（web サービスと同じイメージを使用）
    build: .
    # Sidekiq を起動するコマンド（config/sidekiq.yml の設定を読み込む）
    command: bundle exec sidekiq -C config/sidekiq.yml
    # ホストとコンテナ間でファイルを共有（マウント）
    volumes:
      # カレントディレクトリ(.)をコンテナ内の /app にマウント（ソースコードの同期）
      - .:/app
      # gem を永続化するためのボリュームをマウント（bundle install の結果を保存）
      - bundle:/usr/local/bundle
    # 依存関係の設定（db と redis サービスが起動してから sidekiq を起動）
    depends_on:
      # データベースサービスへの依存
      - db
      # Redis サービスへの依存
      - redis
    # .envファイルから環境変数を読み込む設定　【Redis の接続URL（Sidekiq が使用）】
    env_file:
      - .env 

# 名前付きボリュームの定義（データを永続化するための領域）
volumes:
  # PostgreSQL のデータを保存するボリューム
  postgres_data:
  # gem を永続化するためのボリューム
  bundle:
  # Redis のデータを保存するボリューム
  redis_data: