# config/cable.yml
# アプリのリアルタイム通信（Action Cable）機能で、環境ごとにどこを使ってデータをやり取りするかを設定するファイル
development:
  # 開発環境では非同期アダプターを使用する
  adapter: async 
test:
  # テスト環境ではテスト用のアダプターを使用する
  adapter: test

production:
  # 本番環境ではRedisをアクションケーブルのアダプターとして使用する
  adapter: redis
  # 環境変数REDIS_URLから接続先を取得し、なければデフォルトのローカルRedisを指定する
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %> 
  # 本番環境でのチャンネル名の重複を防ぐためのプレフィックスを設定する
  channel_prefix: app_production 
