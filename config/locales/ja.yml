# config/locales/ja.yml
# ビュー・コントローラーのメッセージ
# アプリ独自の翻訳（体重設定、通知時間設定、パスワード変更、バリデーションエラー、カラム名など）

# 日本語設定の開始
ja:
  # 【修正】コントローラーから呼び出されるフラッシュメッセージをまとめるための階層を追加する
  controllers:
    application:
      security_alert: 'セキュリティのため、パスワード変更や設定画面等へ進むには、通常のログインを行ってください。'
    contacts:
      complete: 'お問い合わせを受け付けました。'
    token_authentications:
      invalid_token: '無効なURL、または有効期限（24時間）が切れています。通常ログインを行ってください。'
      already_used: 'このワンタイムURLはすでに使用されています。'
      success: '自動でログインしました。'
    water_intakes:
      missing_weight: '体重を設定してください'
      invalid_amount: '不正な水分量が送信されました'
      missing_time: '時刻を入力してください'
      achievement: '🎉 目標を達成しました! 🎉'
      recorded: '記録しました!'
      created: '記録しました'
      deleted: '記録を削除しました'
      destroy_failed: '記録を削除できませんでした'

  # 通知時間設定画面のメッセージを追加
  notification_time_settings:
    create:
      success: 'メール通知時間を設定しました' # 初回設定成功時のメッセージ
    update:
      success: 'メール通知時間を更新しました' # 2回目以降の更新成功時のメッセージ

  # 体重設定画面のメッセージを追加
  weight_settings:
    update:
      success: '体重を保存しました' # 体重保存成功時のメッセージ

  # ユーザー登録関連のメッセージ
  users:
    registrations:
      # 【修正】利用規約に同意していない場合のエラーメッセージを追加
      terms_not_agreed: 利用規約とプライバシーポリシーに同意してください
      # 【修正】登録完了時のフラッシュメッセージを追加
      signed_up: 新規登録が完了しました
  
  # パスワード変更のフラッシュメッセージ
  password_settings:
    update:
      success: パスワードを変更しました
      failure: パスワードの変更に失敗しました

  # 時刻の表示形式設定
  time:
    formats:
      default: "%Y/%m/%d %H:%M:%S" # デフォルトの時刻表示形式（例: 2026/○/○ 14:30:00）
      short: "%m/%d %H:%M" # 短縮形式の時刻表示（例: 01/15 14:30）
  
  # 日付の表示形式設定
  date:
    formats:
      default: "%Y/%m/%d" # デフォルトの日付表示形式（例: 2026/01/15）
      short: "%m/%d" # 短縮形式の日付表示（例: 01/15）
      year_month: "%Y年%m月" # 【修正】年月のみを表示（例: 2025年01月）

  # 飲水記録のフラッシュメッセージ
  water_intakes:
    created: '記録しました' # 記録作成成功時のメッセージ
    create_failed: '記録できませんでした' # 記録作成失敗時のメッセージ
    destroyed: '記録を削除しました' # 記録削除成功時のメッセージ
    destroy_failed: '記録を削除できませんでした' # 記録削除失敗時のメッセージ
    
