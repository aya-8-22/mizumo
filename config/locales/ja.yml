# config/locales/ja.yml
# アプリ独自の翻訳（体重設定、通知時間設定、パスワード変更、バリデーションエラー、カラム名など）

# 日本語設定の開始
ja:
  # 通知時間設定画面のメッセージを追加
  notification_time_settings:
    create:
      success: 'メール通知時間を設定しました' # 初回設定成功時のメッセージ
    update:
      success: 'メール通知時間を更新しました' # 2回目以降の更新成功時のメッセージ

  # 体重設定画面のメッセージを追加
  weight_settings:
    update:
      success: '体重を保存しました' # 体重保存成功時のメッセージ

  # ユーザー登録関連のメッセージ
  users:
    registrations:
      terms_not_agreed: 利用規約とプライバシーポリシーに同意してください
  
  # パスワード変更のフラッシュメッセージ
  password_settings:
    update:
      success: パスワードを変更しました
      failure: パスワードの変更に失敗しました

  # 時刻の表示形式設定
  time:
    formats:
      default: "%Y/%m/%d %H:%M:%S" # デフォルトの時刻表示形式（例: 2026/○/○ 14:30:00）
      short: "%m/%d %H:%M" # 短縮形式の時刻表示（例: 01/15 14:30）
  
  # 日付の表示形式設定
  date:
    formats:
      default: "%Y/%m/%d" # デフォルトの日付表示形式（例: 2026/01/15）
      short: "%m/%d" # 短縮形式の日付表示（例: 01/15）
  
  # 飲水記録のフラッシュメッセージ
  water_intakes:
    created: '記録しました' # 記録作成成功時のメッセージ
    create_failed: '記録できませんでした' # 記録作成失敗時のメッセージ
    destroyed: '記録を削除しました' # 記録削除成功時のメッセージ
    destroy_failed: '記録を削除できませんでした' # 記録削除失敗時のメッセージ

  # フォームヘルパーの翻訳設定   
  helpers:
    submit:  # 送信ボタンのラベル翻訳
      create: 登録 # 新規作成ボタンのラベル
      submit: 保存 # 保存ボタンのラベル
      update: 更新 # 更新ボタンのラベル
    # フォームのラベル翻訳（Devise のフォームラベルを日本語化）
    label:
      user: # User モデルのフォームラベル
        email: メールアドレス # メールアドレスのラベル
        password: パスワード # パスワードのラベル
        password_confirmation: "パスワード（確認）" # パスワード確認のラベル
        weight: "体重" # 体重のラベル
        remember_me: "ログイン状態を保持する" # ログイン状態を保持するチェックボックスのラベル
        terms_of_service: "利用規約とプライバシーポリシー" # 利用規約のラベル
        current_password: "現在のパスワード" # 【修正】現在のパスワードのラベル
  
  # ActiveRecord（モデル）の翻訳設定
  activerecord: 
    # モデル名の翻訳
    models:
      user: "ユーザー" 
      board: "掲示板"

    # モデルのカラム名の翻訳
    attributes:
      user: # User モデルのカラム名を日本語化
        email: "メールアドレス" # email カラムの日本語表示名（エラーメッセージ例: 「メールアドレスを入力してください」）
        password: "パスワード" # password カラムの日本語表示名（エラーメッセージ例: 「パスワードを入力してください」）
        password_confirmation: "パスワード（確認）" # password_confirmation カラムの日本語表示名（エラーメッセージ例: 「パスワード（確認）を入力してください」）
        weight: "体重" # weight カラムの日本語表示名（エラーメッセージ例: 「体重を入力してください」）
        current_password: "現在のパスワード" # current_password カラムの日本語表示名
        # weight: "体重" # weight カラムの日本語表示名（エラーメッセージ例: 「体重を入力してください」）
        terms_of_service: "利用規約とプライバシーポリシー" # 【修正】terms_of_service カラムの日本語表示名
        # first_name: "名" # first_name カラムの日本語表示名（エラーメッセージ例: 「名を入力してください」）
        # last_name: "姓" # last_name カラムの日本語表示名（エラーメッセージ例: 「姓を入力してください」）

      board:
        title: タイトル
        body: 本文

    # バリデーションエラーメッセージの翻訳
    errors:
      messages: # エラーメッセージの定義
        blank: "を入力してください" # 必須項目が空の場合（例: 「体重を入力してください」）
        too_short: "は%{count}文字以上で入力してください" # 文字数が最小値未満の場合（例: 「パスワードは8文字以上で入力してください」）
        too_long: "は%{count}文字以内で入力してください" # 文字数が最大値を超えた場合（例: 「名前は255文字以内で入力してください」）
        invalid: "は不正な値です" # 形式が不正な場合（例: 「メールアドレスは不正な値です」）
        taken: "はすでに存在します" # すでに存在する値の場合（# 【修正】デフォルトのメッセージ（メールアドレス以外で使用）
        not_a_number: "は数値で入力してください" # 数値でない場合（例: 「体重は数値で入力してください」）
        greater_than: "は%{count}より大きい値にしてください" # 指定値より大きい必要がある場合（例: 「体重は0より大きい値にしてください」）
        greater_than_or_equal_to: "は%{count}以上の値にしてください" # 指定値以上である必要がある場合（例: 「年齢は18以上の値にしてください」）
        less_than: "は%{count}より小さい値にしてください" # 指定値より小さい必要がある場合（例: 「年齢は100より小さい値にしてください」）
        less_than_or_equal_to: "は%{count}以下の値にしてください" # 指定値以下である必要がある場合（例: 「年齢は120以下の値にしてください」）
        confirmation: "と%{attribute}の入力が一致しません" #【追加】確認用の値が一致しない場合（例: 「パスワードとパスワード（確認）の入力が一致しません」）
        accepted: "にチェックを入れてください" # チェックボックスがチェックされていない場合のメッセージ
      models:
        user:
          attributes:
            email: # email カラム固有のエラーメッセージ
              taken: "が使用できないものになっています。別のメールアドレスをご使用ください" #【追加】User モデルの email カラム専用のメッセージ
              blank: "を入力してください" # メールアドレスが空の場合のメッセージ
              invalid: "の形式が正しくありません" # メールアドレスの形式が不正な場合のメッセージ
            password:
              blank: "を入力してください" # パスワードが空の場合のメッセージ
              too_short: "は%{count}文字以上で入力してください" # パスワードが短すぎる場合のメッセージ
            password_confirmation: # password_confirmation カラム固有のエラーメッセージ
              confirmation: "とパスワードが一致しません" # パスワードとパスワード確認が一致しない場合のメッセージ
            terms_of_service: # 【修正】terms_of_service カラム固有のエラーメッセージ
              accepted: "に同意して、レ点チェックを入れてください" # 【修正】利用規約にチェックが入っていない場合のメッセージ