# .github/workflows/ci.yml
# GitHub ActionsのCIを自動化するための設定ファイルで、コードの変更時にテストやビルドを自動実行する仕組みを定義

# GitHub Actionsのワークフロー全体の名前を指定します
name: Rails CI

# このワークフローをいつ実行するか（今回はプッシュ時）を指定します
on: push

# 実行する具体的な処理（ジョブ）のリストを定義します
jobs:
  # testという名前のジョブを作成します
  test:
    # 仮想マシンのOSとして最新のUbuntu環境を使用します
    runs-on: ubuntu-latest
    
    # テストが長引いたときに10分で自動終了するタイムアウトを設定します
    timeout-minutes: 10

    # ジョブ全体で使う環境変数をまとめて定義します
    env:
      # database.yml.ciを使わず、既存のdatabase.ymlの環境変数駆動の仕組みをそのまま使います
      RAILS_ENV: test
      # database.ymlのhostをCI用のlocalhostに上書きします
      DATABASE_HOST: localhost
      # database.ymlのusernameをCI用に上書きします(postgresサービスと一致させる)
      DATABASE_USER: postgres
      # database.ymlのpasswordをCI用に上書きします(postgresサービスと一致させる)
      DATABASE_PASSWORD: password
      # 【修正】RAILS_MASTER_KEYをGitHub の Secrets に登録ため記載
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }} 

    # テスト実行時に裏側で動かす外部サービス（データベース）を設定します
    services:
      # PostgreSQLサービスを「postgres」という名前で定義します
      postgres:
        # ローカルのdocker-compose.ymlに合わせてPostgreSQL 14のイメージを指定します
        image: postgres:14
        
        # テスト用コンテナ内で使用するダミーの環境変数を設定します
        env:
          # 上のenvのDATABASE_USERと値を揃えます
          POSTGRES_USER: postgres
          # 上のenvのDATABASE_PASSWORDと値を揃えます
          POSTGRES_PASSWORD: password
          # database.ymlのtest用データベース名(app_test)と揃えます
          POSTGRES_DB: app_test
          
        # アプリから接続できるようにポート番号（5432）を開放します
        ports:
          - 5432:5432
          
        # DBが起動完了するまで接続を待つヘルスチェック設定です
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 仮想マシンの上で順番に実行する手順（ステップ）を定義します
    steps:
      # GitHub上のリポジトリのコードを仮想マシンにダウンロードします
      - name: Checkout code
        uses: actions/checkout@v4

      # 指定したバージョンのRubyを仮想マシンにセットアップします
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Gemfileに記載のバージョンと揃えます
          ruby-version: '3.2.4'
          # trueにするとgemのキャッシュ保存とbundle installを自動で実行してくれます
          bundler-cache: true

      # database.yml.ciは削除済みのため、cpコマンドを使わずdatabase.ymlをそのまま使ってDBを作成します
      - name: Create database
        run: bundle exec rails db:create

      # db:migrateではなくschema.rbから直接読み込むことで、マイグレーション履歴に関係なく最新のテーブル構造を再現できます
      - name: Load schema
        run: bundle exec rails db:schema:load

      # 自動テスト（RSpec）を実行します
      - name: Run RSpec
        run: bundle exec rspec
    
      # 【修正】テスト失敗時にログを表示する
      - name: テスト失敗時にログを表示する
        if: failure()
        run: cat log/test.log

      # コードの書き方チェック（RuboCop）を実行します
      - name: Run RuboCop
        run: bundle exec rubocop