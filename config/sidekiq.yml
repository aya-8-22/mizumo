# config/sidekiq.yml
# 【追加】Sidekiq の設定ファイル（ジョブの処理方法やキューの設定を管理）

# 開発環境の設定
:development:
  # 同時に実行するワーカー（ジョブを処理するプロセス）の数
  # 開発環境では1つのワーカーで十分
  :concurrency: 1

# テスト環境の設定
:test:
  # テスト環境でも1つのワーカーで十分
  :concurrency: 1

# 本番環境の設定
:production:
  # 本番環境では複数のワーカーを動かしてパフォーマンスを向上させる
  # サーバーのスペックに応じて調整（メール配信が溜まってきたら、10へ変更予定）
  :concurrency: 5

# キューの優先度設定
# 数字が大きいほど優先度が高い
# critical: 最優先で処理したいジョブ（例：決済処理）
# default: 通常のジョブ（例：メール送信）
# low: 優先度の低いジョブ（例：ログの集計）
:queues:
  - [critical, 3]
  - [default, 2]
  - [low, 1]